name: Windows release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'main.js'
      - 'preload.js'
      - 'simconnect-bridge.js'
      - 'package.json'
permissions:
  contents: write
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set release repository
        shell: pwsh
        run: |
          $p = Get-Content package.json -Raw | ConvertFrom-Json
          $parts = "${{ github.repository }}".Split('/')
          $p.build.publish.owner = $parts[0]
          $p.build.publish.repo = $parts[1]
          $p | ConvertTo-Json -Depth 20 | Set-Content package.json -Encoding utf8
      - run: npm install
      - name: Build installer without automatic publishing
        run: npm run pack -- --publish never
      - name: Publish release assets
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $exe = @(Get-ChildItem "dist" -Filter "*.exe")
          if ($exe.Count -ne 1) { throw "Expected 1 installer EXE, found $($exe.Count)" }
          $installer = $exe[0]
          $sum = [System.Security.Cryptography.SHA512]::HashData([System.IO.File]::ReadAllBytes($installer.FullName))
          $sha = [Convert]::ToBase64String($sum)
          $name = $installer.Name
          $size = $installer.Length
          $date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ss.fffZ')
          $latest = @"
          version: $version
          files:
            - url: $name
              sha512: $sha
              size: $size
          path: $name
          sha512: $sha
          releaseDate: '$date'
          "@
          $latest | Set-Content "dist/latest.yml" -Encoding utf8
          $releaseList = gh release list --repo "${{ github.repository }}" --json tagName --limit 100 | ConvertFrom-Json
          $exists = @($releaseList | Where-Object { $_.tagName -eq $tag }).Count -gt 0
          if (-not $exists) {
            gh release create $tag --repo "${{ github.repository }}" --target "${{ github.sha }}" --title $version --notes "Flight Atlas $version"
            if ($LASTEXITCODE -ne 0) { throw "Could not create release $tag" }
          }
          $files = @($installer.FullName, "dist/latest.yml")
          $blocks = @(Get-ChildItem "dist" -Filter "*.blockmap" | ForEach-Object { $_.FullName })
          $files += $blocks
          gh release upload $tag $files --repo "${{ github.repository }}" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload release assets" }
      - uses: actions/upload-artifact@v4
        with:
          name: Flight-Atlas-Windows-Installer
          path: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
