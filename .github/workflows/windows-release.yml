name: Windows release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set release repository
        shell: pwsh
        run: |
          $p = Get-Content package.json -Raw | ConvertFrom-Json
          $parts = '${{ github.repository }}'.Split('/')
          $p.build.publish.owner = $parts[0]
          $p.build.publish.repo = $parts[1]
          $p | ConvertTo-Json -Depth 20 | Set-Content package.json -Encoding utf8
      - run: npm install
      - name: Build Windows installer
        if: github.event_name == 'workflow_dispatch'
        run: npm run pack
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tagged update
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: Flight-Atlas-Windows-Installer
          path: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
