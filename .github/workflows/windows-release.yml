name: Windows release
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set release repository
        shell: pwsh
        run: |
          $p = Get-Content package.json -Raw | ConvertFrom-Json
          $parts = '${{ github.repository }}'.Split('/')
          $p.build.publish.owner = $parts[0]
          $p.build.publish.repo = $parts[1]
          $p | ConvertTo-Json -Depth 20 | Set-Content package.json -Encoding utf8
      - run: npm install
      - name: Prepare version tag
        id: release
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          git ls-remote --exit-code --tags origin "refs/tags/$tag" | Out-Null
          if ($LASTEXITCODE -eq 0) {
            "publish=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Tag $tag already exists; creating installer artifact only."
          } else {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag $tag
            git push origin "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw "Failed to push tag $tag" }
            "publish=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
      - name: Publish versioned update
        if: steps.release.outputs.publish == 'true'
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Windows installer
        if: steps.release.outputs.publish != 'true'
        run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: Flight-Atlas-Windows-Installer
          path: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
