name: Android beta
on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-beta.yml'

permissions:
  contents: read

jobs:
  android:
    name: Build Flight Atlas Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out the existing Flight Atlas
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install API 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare Flight Atlas frontend
        run: npm run build:web
      - name: Generate Capacitor Android project
        run: npx cap add android
      - name: Register Discord OAuth callback and verify API 36
        run: npm run android:patch
      - name: Synchronize Android assets and plugins
        run: npx cap sync android
      - name: Build debug APK and unsigned release AAB
        run: cd android && chmod +x gradlew && ./gradlew :app:assembleDebug :app:bundleRelease --no-daemon --stacktrace
      - name: Upload Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: Flight-Atlas-Android-debug-APK
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload unsigned app bundle (not for Play upload)
        uses: actions/upload-artifact@v4
        with:
          name: Flight-Atlas-Android-unsigned-AAB
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
